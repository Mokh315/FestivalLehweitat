let LBL={kind:null,key:null};
function curLabel(kind,key){
  const C=CU();
  if(kind==="title"){ if(C.titles[key]) return C.titles[key];
    return SCHEMA[key]?SCHEMA[key].title:(UI["p_"+key]||["","",""]); }
  if(kind==="field"){ if(C.fields[key]) return C.fields[key];
    const a=key.split("."), fl=SCHEMA[a[0]].fields.filter(function(x){return x.k===a[1]})[0];
    return fl?fl.l:["","",""]; }
  if(kind==="term"){ if(C.terms[key]) return C.terms[key];
    return [key,(TERM[key]||[key,key])[0],(TERM[key]||[key,key])[1]]; }
  return ["","",""];
}
function three(v,pfx){
  return `<div class="field"><label>${T("lbl_ar")}</label><input id="${pfx}0" value="${esc(v[0]||"")}"></div>
    <div class="frow">
      <div class="field"><label>${T("lbl_fr")}</label><input id="${pfx}1" value="${esc(v[1]||"")}"></div>
      <div class="field"><label>${T("lbl_en")}</label><input id="${pfx}2" value="${esc(v[2]||"")}"></div>
    </div>`;
}
function openLabel(kind,key){
  if(!isAdmin()){toast(T("noAccess"),true); return}
  LBL={kind:kind,key:key};
  const v=curLabel(kind,key);
  let body=three(v,"lb");
  if(kind==="title"&&SCHEMA[key]){
    const o=CU().ones[key]||SCHEMA[key].one;
    body+=`<hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
      <label style="font-size:.82rem;font-weight:700;color:var(--text-secondary)">${T("lbl_single")}</label>
      <p style="font-size:.78rem;color:var(--text-muted);margin:2px 0 8px">${T("lbl_singleN")}</p>`+three(o,"lo");
  }
  document.getElementById("mTitle").textContent=T("lbl_edit");
  document.getElementById("mBody").innerHTML=body+`<div class="note" style="font-size:.79rem">${T("lbl_note")}</div>`;
  document.getElementById("mFoot").innerHTML=
    `<button class="btn" onclick="closeModal()">${T("cancel")}</button>
     <button class="btn p" onclick="saveLabel()">${T("save")}</button>`;
  document.getElementById("modal").classList.add("on");
}
function grab(pfx){
  const a=[0,1,2].map(function(i){const e=document.getElementById(pfx+i); return e?e.value.trim():""});
  if(!a[0]) return null;
  if(!a[1]) a[1]=a[0];
  if(!a[2]) a[2]=a[1];
  return a;
}
function saveLabel(){
  const v=grab("lb");
  if(!v){toast(T("reqField")+" "+T("lbl_ar"),true); return}
  const C=CU();
  if(LBL.kind==="title"){ C.titles[LBL.key]=v;
    const o=grab("lo"); if(o) C.ones[LBL.key]=o; }
  else if(LBL.kind==="field") C.fields[LBL.key]=v;
  else if(LBL.kind==="term") C.terms[LBL.key]=v;
  logAct("تعديل","—",T("lbl_edit")+": "+v[0]);
  closeModal(); saveLocal(); chrome(); buildNav(); toast(T("lbl_saved")); go(CUR);
}
function resetLabel(kind,key){
  const C=CU();
  if(kind==="title"){delete C.titles[key]; delete C.ones[key]}
  else if(kind==="field") delete C.fields[key];
  else if(kind==="term") delete C.terms[key];
  saveLocal(); chrome(); buildNav(); toast(T("lbl_resetDone")); go(CUR);
}

let NOPT={sec:null,fk:null};
function openNewOpt(sec,fk){
  if(!isAdmin()){toast(T("noAccess"),true); return}
  NOPT={sec:sec,fk:fk};
  const fl=SCHEMA[sec].fields.filter(function(x){return x.k===fk})[0];
  document.getElementById("mTitle").textContent=T("opt_addT")+" — "+fLabel(sec,fl);
  document.getElementById("mBody").innerHTML=three(["","",""],"no")+
    `<div class="note" style="font-size:.79rem">${T("lbl_note")}</div>`;
  document.getElementById("mFoot").innerHTML=
    `<button class="btn" onclick="closeModal()">${T("cancel")}</button>
     <button class="btn p" onclick="saveNewOpt()">${T("save")}</button>`;
  document.getElementById("modal").classList.add("on");
}
function saveNewOpt(){
  const v=grab("no");
  if(!v){toast(T("reqField")+" "+T("lbl_ar"),true); return}
  const key=NOPT.sec+"."+NOPT.fk, C=CU();
  const fl=SCHEMA[NOPT.sec].fields.filter(function(x){return x.k===NOPT.fk})[0];
  if(fOpts(NOPT.sec,fl).indexOf(v[0])>=0){toast(T("opt_dup"),true); return}
  if(!C.options[key]) C.options[key]=[];
  C.options[key].push(v[0]);
  C.terms[v[0]]=v;
  logAct("إضافة","—",T("opt_add")+": "+v[0]);
  closeModal(); saveLocal(); toast(T("opt_added")); go(CUR);
}
function delOpt(sec,fk,val){
  const key=sec+"."+fk, C=CU(), a=C.options[key]||[];
  const i=a.indexOf(val); if(i>=0) a.splice(i,1);
  delete C.terms[val];
  saveLocal(); toast(T("deleted")); go(CUR);
}

   case "awards": return pageWrap(k,"in_awards");
   case "members": return pageWrap(k,"in_members",
     `<div class="grid g2"><div class="card"><h3>${T("mb_byBody")}</h3>${barChart(countBy(DB.members,"body"),"var(--series-3)")}
       <div class="legend"><span>${T("mb_total")}: ${num(DB.members.length)}</span></div></div>
      <div class="card"><h3>${T("gs_dist")}</h3>${donut(countBy(DB.members,"role"),T("person"))}</div></div>`);
   case "plan": {
     const late=DB.plan.filter(function(t){return t.status==="متأخرة"}).length;
     const open=DB.plan.filter(function(t){return t.status==="جارية"}).length;
     const fin=DB.plan.filter(function(t){return t.status==="منجزة"}).length;
     const avg=Math.round(DB.plan.reduce(function(a,t){return a+(+t.done||0)},0)/(DB.plan.length||1));
     return pageWrap(k,"in_plan",
     `<div class="grid g4" style="margin-bottom:14px">
        <div class="kpi"><div class="kl">${T("pl_open")}</div><div class="kv">${num(open)}</div></div>
        <div class="kpi k2"><div class="kl">${T("pl_doneN")}</div><div class="kv">${num(fin)}</div></div>
        <div class="kpi k3"><div class="kl">${T("pl_late")}</div><div class="kv">${num(late)}</div></div>
        <div class="kpi k4"><div class="kl">${T("pr_avg")}</div><div class="kv">${num(avg)}%</div></div>
      </div>
      <div class="card"><h3>${T("pl_prog")}</h3>
      ${DB.plan.slice(0,14).map(function(t){return `<div class="bar-row" title="${esc(tv(t.task))}">
        <span class="bl">${esc(tv(t.task))}</span>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,+t.done||0)}%;background:${t.status==="متأخرة"?"var(--series-2)":"var(--green)"}"></div></div>
        <span class="bv">${num(t.done||0)}%</span></div>`}).join("")}
      <div class="legend"><span><i style="background:var(--green)"></i> ${T("pl_leg")}</span>
        <span><i style="background:var(--series-2)"></i> ${T("pl_late")}</span></div></div>`);}
   case "products": return pageWrap(k,"in_products",
     `<div class="card"><h3>${T("prod_avail")}</h3>${donut(countBy(DB.products,"avail"),T("product"))}</div>`);
   case "budget": {
     const inc=DB.budget.filter(b=>b.kind==="إيراد").reduce((a,b)=>a+(+b.amount||0),0);
     const exp=DB.budget.filter(b=>b.kind==="نفقة").reduce((a,b)=>a+(+b.amount||0),0);
     return pageWrap(k,"in_budget",
     `<div class="grid g3" style="margin-bottom:14px">
        <div class="kpi k2"><div class="kl">${T("bg_inc")}</div><div class="kv">${num(inc)}</div><div class="kn">${esc(tv(CFG.currency))}</div></div>
        <div class="kpi"><div class="kl">${T("bg_exp")}</div><div class="kv">${num(exp)}</div><div class="kn">${esc(tv(CFG.currency))}</div></div>
        <div class="kpi k3"><div class="kl">${T("bg_bal")}</div><div class="kv">${num(inc-exp)}</div><div class="kn">${esc(tv(CFG.currency))}</div></div>
      </div>
      <div class="card"><h3>${T("bg_byItem")}</h3>${barChart(DB.budget.map(b=>[tv(b.item)+" ("+termC(b.kind)+")",+b.amount||0]),"var(--series-4)")}
      <div class="legend"><span>${esc(tv(CFG.currency))} — ${T("bg_leg")}</span></div></div>`);}
   case "media": return pageWrap(k,"in_media",
     `<div class="card"><button class="btn" onclick="go('gallery')">🖼️ ${T("med_btn")}</button></div>`);
   case "regs": return pageWrap(k,"in_regs",
     `<div class="card"><h3>${T("reg_new")}</h3>
      <p style="font-size:.88rem;color:var(--text-secondary)">${T("reg_p")}</p>
      <button class="btn p" onclick="openForm('regs')">📝 ${T("reg_btn")}</button>
      ${DB.regs.length?`<div style="margin-top:14px">${donut(countBy(DB.regs,"kind"),T("request"))}</div>`:
        `<div class="note" style="margin-top:12px">${T("reg_none")}</div>`}</div>`);
   default: return SCHEMA[k]?pageWrap(k,null):`<div class="card"><p class="empty">${T("noResults")}</p></div>`;
  }
}
function tab(btn,id){
  const wrap=btn.parentElement;
  wrap.querySelectorAll("button").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  const pane=document.getElementById(id);
  pane.parentElement.querySelectorAll(".tabpane").forEach(p=>p.classList.remove("on"));
  pane.classList.add("on");
  initMotion();
}

/* ---------- الإقلاع ---------- */
document.addEventListener("keydown",e=>{
  const open=document.getElementById("lb").classList.contains("on");
  if(e.key==="Escape"){closeModal(); lbClose(); return}
  if(!open) return;
  const rtl=document.documentElement.dir==="rtl";
  if(e.key==="ArrowRight"){lbStep(rtl?-1:1); e.preventDefault()}
  if(e.key==="ArrowLeft"){lbStep(rtl?1:-1); e.preventDefault()}
  if(e.key===" "){lbAuto(); e.preventDefault()}
});
document.getElementById("lb").addEventListener("click",e=>{if(e.target.id==="lb") lbClose()});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal") closeModal()});
/* ---------- فحص توافق المتصفح ---------- */
function compatCheck(){
  const miss=[];
  try{if(!window.IntersectionObserver) miss.push("IntersectionObserver")}catch(e){}
  try{if(!CSS||!CSS.supports||!CSS.supports("display","grid")) miss.push("CSS Grid")}catch(e){miss.push("CSS.supports")}
  try{if(!CSS.supports("inset-inline-start","0px")) miss.push("logical properties")}catch(e){}
  if(miss.length){
    const d=document.createElement("div"); d.className="compatwarn";
    d.innerHTML="⚠ "+T("compatMsg");
    const g=document.querySelector(".gbox"); if(g) g.insertBefore(d,g.firstChild);
  }
}
/* ---------- الإقلاع ---------- */
try{
  loadLocal();
  applyCustom();
  document.documentElement.setAttribute("data-motion",MOTION?"on":"off");
  document.getElementById("mtbtn").textContent=MOTION?"🎞️":"⏸️";
  setLang(LI);        /* LI قد تكون مستعادة من الحفظ المحلي */
  compatCheck();
  fetchPublished();
  if("serviceWorker" in navigator && String(location.protocol).indexOf("http")===0){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").catch(function(){});
    });
  }
}catch(err){
  document.body.innerHTML='<div class="bootfail"><b>تعذّر تشغيل المنصة على هذا المتصفح.</b><br>'+
   'Impossible de lancer la plateforme sur ce navigateur.<br>Unable to start the platform in this browser.<br><br>'+
   'يُرجى تحديث المتصفح أو فتح الملف بـ Chrome / Safari الحديث.<br><br>'+
   '<span style="font-size:.8rem;opacity:.75;direction:ltr;display:block">'+String(err&&err.message||err)+'</span></div>';
}
