<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light" data-motion="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#234636">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>منصة مهرجان الحويطات الدولي للثقافة والتنمية</title>
<meta name="description" content="منصة إدارة والإشراف على مهرجان الحويطات الدولي للثقافة والتنمية — مدينة الحويطات الأثرية، مركز الرشيد، ولاية تكانت، موريتانيا. Plateforme de gestion du Festival international d'El Hweitat. El Hweitat International Festival management platform.">
<meta name="author" content="اللجنة الدائمة لمهرجان الحويطات">
<!-- بطاقة المشاركة في واتساب وفيسبوك — بعد النشر ضع الرابط الكامل مكان og.jpg مثل: https://اسمك.github.io/hweitat/og.jpg -->
<meta property="og:type" content="website">
<meta property="og:title" content="مهرجان الحويطات الدولي للثقافة والتنمية">
<meta property="og:description" content="منصة الإدارة والإشراف على المهرجان — التراث والآثار، البرامج، اللجان، المشاريع التنموية. بثلاث لغات.">
<meta property="og:image" content="og.jpg">
<meta property="og:locale" content="ar_MR">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مهرجان الحويطات">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* ============ الخطوط والأساسيات ============ */
*,*::before,*::after{box-sizing:border-box}
:root{
  /* هوية المهرجان — مستخلصة من الشعار */
  --brown:#8a5a2b; --brown-d:#6d4520; --brown-l:#b5813f;
  --green:#2f5d45; --green-d:#234636; --green-l:#4a7f61;
  --amber:#e0a040; --amber-d:#c1832a; --amber-l:#f0c47e;
  --sand:#fffaf2; --sand-2:#f7eddd; --sand-3:#efe0c9;
  --ink:#2a211a; --ink-2:#5b4e42; --ink-3:#8a7d70;
  --line:#e3d5be; --white:#fff; --track:#f2e6d2;
  --surface-1:#fffaf2; --surface-2:#fff;
  --text-primary:#2a211a; --text-secondary:#5b4e42; --text-muted:#8a7d70;
  /* سلاسل الرسوم البيانية — لوحة مُصادق عليها */
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  --good:#1f8a4c; --warn:#c1832a; --bad:#c2402f; --info:#2a78d6;
  --r:14px; --r-s:9px;
  --sh-1:0 1px 2px rgba(42,33,26,.06),0 2px 8px rgba(42,33,26,.05);
  --sh-2:0 4px 16px rgba(42,33,26,.10),0 12px 32px rgba(42,33,26,.07);
  --nav-w:274px;
}
html[data-theme="dark"]{
  --sand:#171410; --sand-2:#211c16; --sand-3:#2c251d;
  --ink:#f6efe4; --ink-2:#cdc2b3; --ink-3:#9d9284; --line:#39301f;
  --white:#211c16;
  --surface-1:#171410; --surface-2:#211c16;
  --text-primary:#f6efe4; --text-secondary:#cdc2b3; --text-muted:#9d9284;
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --amber-l:#8a6320; --sand-3:#2c251d;
  --track:#332b21;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 28px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  font-family:"Segoe UI","Tahoma","Noto Naskh Arabic","Amiri",Arial,sans-serif;
  background:var(--sand); color:var(--ink); line-height:1.75; font-size:15.5px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0 0 .5em; line-height:1.4; font-weight:700; color:var(--ink)}
h1{font-size:1.6rem} h2{font-size:1.28rem} h3{font-size:1.08rem} h4{font-size:.98rem}
p{margin:0 0 .8em}
a{color:var(--brown); text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit; font-size:inherit; cursor:pointer}
::selection{background:var(--amber-l); color:var(--ink)}

/* ============ الترويسة الرسمية ============ */
.statebar{position:fixed; top:0; inset-inline:0; z-index:45; text-align:center;
  background:var(--green-d); color:#f3ead9; padding:5px 12px; font-size:.76rem; line-height:1.55;
  border-bottom:2px solid var(--amber); letter-spacing:.2px}
.statebar b{color:#fff; font-weight:700}
.statebar span{color:#c9dbcd}
.app{padding-top:44px}
.side{top:44px!important; height:calc(100vh - 44px)!important}
.topbar{top:44px!important}
.statemini{font-size:.68rem; line-height:1.6; color:#c9dbcd; margin-bottom:9px;
  padding-bottom:8px; border-bottom:1px solid rgba(255,255,255,.14)}
.statemini b{display:block; color:#fff; font-size:.72rem; font-weight:700}
.stategate{font-size:.79rem; line-height:1.7; color:var(--text-secondary); margin-bottom:12px;
  padding-bottom:10px; border-bottom:1px solid var(--line)}
.stategate b{display:block; color:var(--ink); font-weight:700; font-size:.86rem}
.herostate{text-align:center; color:#fff; font-size:.83rem; line-height:1.7;
  text-shadow:0 1px 8px rgba(0,0,0,.7); margin-bottom:12px; padding-bottom:9px;
  border-bottom:1px solid rgba(255,255,255,.3)}
.herostate b{display:block; font-size:.95rem; font-weight:700}
.hero .ov.mid{max-width:820px; margin:0 auto; text-align:center}
.hero .ov.mid .pills{justify-content:center}
@media(max-width:640px){
  .statebar{font-size:.66rem; padding:4px 8px}
  .app{padding-top:50px} .side{top:50px!important; height:calc(100vh - 50px)!important}
  .topbar{top:50px!important}
}
@media print{.statebar{position:static} .app{padding-top:0}}

/* ============ الهيكل ============ */
.app{display:flex; min-height:100vh}
/* --- الشريط الجانبي --- */
.side{
  width:var(--nav-w); flex:0 0 var(--nav-w); background:var(--green-d);
  color:#f3ead9; display:flex; flex-direction:column; position:sticky; top:0;
  height:100vh; overflow-y:auto; z-index:40;
  box-shadow:0 0 14px rgba(0,0,0,.18);
}
.side::-webkit-scrollbar{width:7px}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18); border-radius:9px}
.brand{padding:18px 16px 14px; text-align:center; border-bottom:1px solid rgba(255,255,255,.12)}
.brand img{width:112px; height:112px; object-fit:contain; background:#fff; border-radius:50%;
  padding:7px; box-shadow:0 4px 14px rgba(0,0,0,.28)}
.brand .bt{font-size:.96rem; font-weight:700; margin-top:10px; color:#fff; line-height:1.5}
.brand .bs{font-size:.75rem; color:#c9dbcd; letter-spacing:.3px}
.navsec{padding:12px 10px 4px; font-size:.7rem; letter-spacing:1px; color:#9fbaa7;
  text-transform:uppercase; font-weight:700}
.nav{display:flex; flex-direction:column; gap:1px; padding:0 8px}
.nav button{
  display:flex; align-items:center; gap:9px; width:100%; text-align:start;
  background:none; border:0; color:#e4ddd0; padding:8px 11px; border-radius:9px;
  font-size:.895rem; transition:.16s; position:relative;
}
.nav button .ic{width:19px; text-align:center; font-size:1rem; flex:0 0 19px; opacity:.92}
.nav button:hover{background:rgba(255,255,255,.09); color:#fff}
.nav button.on{background:var(--amber); color:#3a2a10; font-weight:700}
.nav button .cnt{margin-inline-start:auto; font-size:.72rem; background:rgba(255,255,255,.16);
  padding:1px 7px; border-radius:20px; min-width:22px; text-align:center}
.nav button.on .cnt{background:rgba(0,0,0,.16); color:#3a2a10}
.sidefoot{margin-top:auto; padding:12px 14px; font-size:.73rem; color:#9fbaa7;
  border-top:1px solid rgba(255,255,255,.12)}

/* --- المحتوى --- */
.main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column}
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--sand);                       /* بديل للمتصفحات القديمة */
  background:color-mix(in srgb,var(--sand) 88%, transparent);
  -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px);
  border-bottom:1px solid var(--line);
  padding:10px 22px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.topbar .crumb{font-size:.8rem; color:var(--ink-3)}
.topbar h1{margin:0; font-size:1.16rem}
.tb-sp{margin-inline-start:auto}
.searchbox{position:relative}
.searchbox input{
  width:230px; padding:7px 32px 7px 12px; border:1px solid var(--line); border-radius:20px;
  background:var(--surface-2); color:var(--ink); font-size:.86rem; font-family:inherit;
}
.searchbox input:focus{outline:2px solid var(--amber); outline-offset:1px; width:290px}
.searchbox .si{position:absolute; inset-inline-end:11px; top:7px; color:var(--ink-3); font-size:.85rem}
.content{padding:20px 22px 60px; max-width:1500px; width:100%}
.page{display:none; animation:fade .28s ease}
.page.on{display:block}
@keyframes fade{from{opacity:0; transform:translateY(7px)}to{opacity:1; transform:none}}

/* ============ مكونات ============ */
.btn{
  display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); padding:6.5px 13px; border-radius:9px;
  font-size:.855rem; font-weight:600; transition:.16s; box-shadow:var(--sh-1);
}
.btn:hover{border-color:var(--brown-l); transform:translateY(-1px)}
.btn.p{background:var(--brown); border-color:var(--brown); color:#fff}
.btn.p:hover{background:var(--brown-d)}
.btn.g{background:var(--green); border-color:var(--green); color:#fff}
.btn.g:hover{background:var(--green-d)}
.btn.a{background:var(--amber); border-color:var(--amber-d); color:#3a2a10}
.btn.sm{padding:3px 9px; font-size:.78rem; border-radius:7px; box-shadow:none}
.btn.dz{color:var(--bad)}
.card{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r);
  padding:18px; box-shadow:var(--sh-1); margin-bottom:16px;
}
.card>h2,.card>h3{margin-top:0}
.grid{display:grid; gap:15px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(200px,100%),1fr))}
.tag{
  display:inline-block; padding:1.5px 9px; border-radius:20px; font-size:.745rem;
  font-weight:700; border:1px solid transparent; white-space:nowrap;
}
.t-ok{background:#e5f4ea; color:#186b3b; border-color:#b9e0c7}
.t-run{background:#e6effa; color:#1c5cab; border-color:#bcd4f2}
.t-wait{background:#fdf2dd; color:#8a5c10; border-color:#f2ddb0}
.t-off{background:#f1ece4; color:#6b6055; border-color:#e0d6c6}
.t-bad{background:#fbe8e4; color:#9c3323; border-color:#f2c9c0}
html[data-theme="dark"] .t-ok{background:#12301e;color:#7fd39d;border-color:#1e4a2e}
html[data-theme="dark"] .t-run{background:#12243d;color:#8fbdf3;border-color:#1d3a5e}
html[data-theme="dark"] .t-wait{background:#332711;color:#e5bd6b;border-color:#4d3a1a}
html[data-theme="dark"] .t-off{background:#292319;color:#b3a795;border-color:#3a3125}
html[data-theme="dark"] .t-bad{background:#3a1a14;color:#eda093;border-color:#54251c}

/* --- بطاقات المؤشرات --- */
.kpi{
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r);
  padding:14px 16px; box-shadow:var(--sh-1); position:relative; overflow:hidden;
}
.kpi::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px; background:var(--brown)}
.kpi.k2::before{background:var(--green)} .kpi.k3::before{background:var(--amber)}
.kpi.k4::before{background:var(--series-1)}
.kpi .kl{font-size:.79rem; color:var(--text-secondary); font-weight:600}
.kpi .kv{font-size:1.9rem; font-weight:800; line-height:1.25; letter-spacing:-.5px; font-variant-numeric:tabular-nums}
.kpi .kn{font-size:.745rem; color:var(--text-muted)}
.kpi .ki{position:absolute; inset-inline-end:12px; top:11px; font-size:1.3rem; opacity:.3}

/* --- الجداول --- */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface-2)}
table.dt{width:100%; border-collapse:collapse; font-size:.865rem; min-width:600px}
table.dt th{
  background:var(--sand-2); text-align:start; padding:9px 12px; font-weight:700;
  font-size:.79rem; color:var(--text-secondary); border-bottom:1px solid var(--line);
  white-space:nowrap; position:sticky; top:0;
}
table.dt td{padding:8.5px 12px; border-bottom:1px solid var(--line); vertical-align:middle}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr:hover{background:var(--sand-2)}
table.dt td.num{font-variant-numeric:tabular-nums; white-space:nowrap}
table.dt .ops{white-space:nowrap; display:flex; gap:4px}
.toolbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:11px}
.toolbar .fsearch{padding:6px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:.84rem; width:190px}
.toolbar select{padding:6px 10px; border:1px solid var(--line); border-radius:8px;
  background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:.84rem}
.empty{padding:34px; text-align:center; color:var(--text-muted); font-size:.9rem}

/* --- شريط التقدم / المقاييس --- */
.meter{display:flex; align-items:center; gap:8px; min-width:130px}
.meter .tr{flex:1; height:7px; background:var(--track); border-radius:20px; overflow:hidden}
.meter .fl{height:100%; border-radius:20px; background:var(--green); transition:width .5s}
.meter .vl{font-size:.78rem; font-weight:700; font-variant-numeric:tabular-nums; min-width:34px; text-align:left}

/* --- الرسوم البيانية --- */
.chart{margin-top:6px}
.bar-row{display:grid; grid-template-columns:minmax(88px,142px) 1fr auto; align-items:center;
  gap:10px; padding:4px 0}
.bar-row .bl{font-size:.83rem; color:var(--text-secondary); text-align:left;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bar-track{background:var(--track); border-radius:5px; height:19px; position:relative; overflow:hidden}
.bar-fill{height:100%; transition:width .55s cubic-bezier(.2,.8,.2,1);
  border-radius:4px;                            /* بديل للمتصفحات القديمة */
  border-start-start-radius:0; border-end-start-radius:0;
  border-start-end-radius:4px; border-end-end-radius:4px}
.bar-row .bv{font-size:.83rem; font-weight:700; font-variant-numeric:tabular-nums; min-width:30px}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:12px; padding-top:10px;
  border-top:1px solid var(--line); font-size:.8rem; color:var(--text-secondary)}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:11px; height:11px; border-radius:3px; display:inline-block}
.donut-wrap{display:flex; align-items:center; gap:18px; flex-wrap:wrap}
.donut{width:132px; height:132px; border-radius:50%; flex:0 0 132px; position:relative;
  box-shadow:inset 0 0 0 1px var(--line)}
.donut .hole{position:absolute; top:26%; right:26%; bottom:26%; left:26%; inset:26%; background:var(--surface-2); border-radius:50%;
  display:flex; flex-direction:column; align-items:center; justify-content:center}
.donut .hole b{font-size:1.25rem; line-height:1; font-variant-numeric:tabular-nums}
.donut .hole s{font-size:.68rem; color:var(--text-muted); text-decoration:none}
.dlist{flex:1; min-width:170px; display:flex; flex-direction:column; gap:5px; font-size:.83rem}
.dlist div{display:flex; align-items:center; gap:7px}
.dlist i{width:11px; height:11px; border-radius:3px}
.dlist b{margin-inline-start:auto; font-variant-numeric:tabular-nums}

/* --- مبدّل اللغة --- */
.langsw{display:inline-flex; border:1px solid var(--line); border-radius:20px; overflow:hidden;
  background:var(--surface-2); box-shadow:var(--sh-1)}
.langsw button{background:none; border:0; padding:5px 11px; font-size:.78rem; font-weight:700;
  color:var(--text-secondary); transition:.15s; letter-spacing:.5px}
.langsw button+button{border-inline-start:1px solid var(--line)}
.langsw button:hover{background:var(--sand-2); color:var(--ink)}
.langsw button.on{background:var(--green); color:#fff}


/* ============ الحركة والصور المتحركة ============ */
/* الشرائح المتعاقبة في الواجهة + تكبير سينمائي (Ken Burns) */
.hero .slides{position:absolute; top:0; right:0; bottom:0; left:0; inset:0; overflow:hidden; z-index:0}
.hero .slides img{position:absolute; top:0; right:0; bottom:0; left:0; inset:0; width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity 1.5s ease; will-change:opacity,transform}
.hero .slides img.on{opacity:.42; animation:kenburns 17s ease-in-out infinite alternate}
@keyframes kenburns{
  from{transform:scale(1.02) translate3d(0,0,0)}
  to{transform:scale(1.16) translate3d(-1.6%,-2%,0)}
}
.hero .dots{position:absolute; bottom:12px; inset-inline-end:16px; display:flex; gap:6px; z-index:3}
.hero .dots button{width:9px; height:9px; padding:0; border-radius:50%; border:1px solid rgba(255,255,255,.6);
  background:rgba(255,255,255,.28); transition:.25s}
.hero .dots button.on{background:var(--amber); border-color:var(--amber); width:26px; border-radius:20px}
.hero .dots button:hover{background:#fff}
.hero .ov{z-index:2}

/* ظهور تدريجي عند التمرير */
.reveal{opacity:0; transform:translateY(15px);
  transition:opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1; transform:none}

/* حركة المعرض */
.gal figure{position:relative}
.gal figure img{transition:transform .7s cubic-bezier(.2,.8,.2,1), filter .4s}
.gal figure:hover img{transform:scale(1.1); filter:saturate(1.12)}
.gal figure figcaption{transition:color .3s}
.gal figure:hover figcaption{color:var(--brown)}
.gal figure::after{content:"⤢"; position:absolute; top:8px; inset-inline-end:8px; width:26px; height:26px;
  display:flex; align-items:center; justify-content:center; border-radius:50%;
  background:rgba(255,255,255,.9); color:#5b4e42; font-size:.85rem; opacity:0;
  transform:scale(.7); transition:.3s; pointer-events:none}
.gal figure:hover::after{opacity:1; transform:scale(1)}

/* شريط الصور المنزلق */
.strip{overflow:hidden; border:1px solid var(--line); border-radius:var(--r); background:var(--sand-2);
  padding:11px 0; -webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent)}
.strip .track{display:flex; gap:11px; width:max-content; animation:marq 52s linear infinite}
.strip:hover .track{animation-play-state:paused}
.strip img{height:112px; width:auto; max-width:210px; object-fit:cover; border-radius:9px; flex:0 0 auto;
  cursor:zoom-in; box-shadow:var(--sh-1); transition:transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .3s}
.strip img:hover{transform:scale(1.07) translateY(-3px); box-shadow:var(--sh-2)}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* عارض الصور المطوّر */
.lightbox{position:fixed; top:0; right:0; bottom:0; left:0; inset:0; background:rgba(18,13,9,.95); z-index:200; display:none;
  align-items:center; justify-content:center; padding:58px 66px 34px; backdrop-filter:blur(3px)}
.lightbox.on{display:flex}
.lightbox img{max-width:100%; max-height:76vh; border-radius:10px; box-shadow:0 14px 60px rgba(0,0,0,.65);
  animation:lbin .5s cubic-bezier(.2,.8,.2,1)}
@keyframes lbin{from{opacity:0; transform:scale(.94)}to{opacity:1; transform:none}}
.lbtop{position:absolute; top:13px; inset-inline-end:18px; display:flex; gap:7px; align-items:center; z-index:3}
.lbtop .cnt{color:#e8dccb; font-size:.83rem; font-variant-numeric:tabular-nums;
  background:rgba(255,255,255,.1); padding:3px 11px; border-radius:20px;
  direction:ltr; unicode-bidi:isolate}
.lbbtn{background:rgba(255,255,255,.13); color:#fff; border:1px solid rgba(255,255,255,.26);
  border-radius:50%; width:34px; height:34px; font-size:1.05rem; display:flex; align-items:center;
  justify-content:center; transition:.2s; line-height:1}
.lbbtn:hover{background:var(--amber); color:#3a2a10; border-color:var(--amber); transform:scale(1.08)}
.lbnav{position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; font-size:1.7rem;
  z-index:3}
.lbnav.a{inset-inline-start:18px} .lbnav.b{inset-inline-end:18px}
.lbnav:hover{transform:translateY(-50%) scale(1.08)}
.lbcap{position:absolute; bottom:26px; inset-inline-start:0; inset-inline-end:0; text-align:center;
  color:#f0e6d6; font-size:.9rem; padding:0 70px; z-index:3}
.lbbar{position:absolute; bottom:0; inset-inline-start:0; height:3px; background:var(--amber); width:0}
.lbbar.run{animation:lbprog 5s linear forwards}
@keyframes lbprog{from{width:0}to{width:100%}}

/* إيقاف الحركة بالكامل */
html[data-motion="off"] .hero .slides img.on{animation:none}
html[data-motion="off"] .strip .track{animation:none}
html[data-motion="off"] .reveal{opacity:1!important; transform:none!important; transition:none}
html[data-motion="off"] .lightbox img{animation:none}
html[data-motion="off"] .page{animation:none}
html[data-motion="off"] .gal figure:hover img{transform:none}
@media (prefers-reduced-motion:reduce){
  .hero .slides img.on{animation:none}
  .strip .track{animation:none}
  .reveal{opacity:1; transform:none; transition:none}
}

/* --- الصور والمعارض --- */
.hero{
  position:relative; border-radius:var(--r); overflow:hidden; margin-bottom:18px;
  min-height:270px; display:flex; align-items:center; box-shadow:var(--sh-2);
  background:var(--green-d);
}
.hero img.bg{position:absolute; top:0; right:0; bottom:0; left:0; inset:0; width:100%; height:100%; object-fit:cover; opacity:.42}
.hero .ov{position:relative; padding:30px 34px; color:#fff; z-index:2; max-width:760px}
.hero .ov h1{color:#fff; font-size:1.85rem; text-shadow:0 2px 14px rgba(0,0,0,.55); margin-bottom:.3em}
.hero .ov p{color:#f0e6d6; text-shadow:0 1px 10px rgba(0,0,0,.6); font-size:.96rem}
.hero .logo{width:96px; height:96px; object-fit:contain; background:#fff; border-radius:16px;
  padding:7px; box-shadow:0 6px 20px rgba(0,0,0,.4); margin-bottom:12px}
.hero .pills{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
.hero .pills span{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.28);
  color:#fff; padding:3px 12px; border-radius:20px; font-size:.79rem; backdrop-filter:blur(4px)}
.gal{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(150px,100%),1fr)); gap:11px}
.gal figure{margin:0; border-radius:var(--r-s); overflow:hidden; border:1px solid var(--line);
  background:var(--surface-2); cursor:zoom-in; transition:.2s; box-shadow:var(--sh-1)}
.gal figure:hover{transform:translateY(-3px); box-shadow:var(--sh-2)}
.gal img{width:100%; height:132px; object-fit:cover; display:block}
.gal figcaption{padding:7px 9px; font-size:.765rem; color:var(--text-secondary); line-height:1.5}

@supports not (background:conic-gradient(#000,#fff)){
  .donut{display:none}
  .dlist{min-width:100%}
}
/* بديل عند غياب دعم الفراغات في flex (متصفحات قديمة) */
@supports not (gap:1px){
  .toolbar>*,.legend>span,.langsw button,.lbtop>*{margin:0 4px 4px 0}
  .gal{display:block}
  .gal figure{display:inline-block; width:47%; margin:0 1% 8px}
}

/* --- قوائم المعلومات --- */
.deflist{display:grid; grid-template-columns:auto 1fr; gap:0}
.deflist dt{padding:7.5px 0; font-weight:700; font-size:.85rem; color:var(--text-secondary);
  border-bottom:1px solid var(--line); padding-inline-end:16px; white-space:nowrap}
.deflist dd{margin:0; padding:7.5px 0; border-bottom:1px solid var(--line); font-size:.895rem}
.deflist dt:last-of-type,.deflist dd:last-of-type{border-bottom:0}
.bullets{margin:0; padding-inline-start:20px}
.bullets li{margin-bottom:5px}
.note{background:var(--sand-2); border-inline-start:4px solid var(--amber); border-radius:var(--r-s);
  padding:11px 14px; font-size:.87rem; color:var(--text-secondary)}
.quote{border-inline-start:4px solid var(--brown); padding:6px 14px; margin:12px 0;
  font-size:1rem; color:var(--ink); background:var(--sand-2); border-radius:var(--r-s)}

/* --- دليل الاستخدام --- */
.hstep h3{color:var(--brown); font-size:1rem; border-bottom:2px solid var(--sand-3); padding-bottom:7px}
ol.steps{margin:0; padding-inline-start:20px; font-size:.9rem; line-height:1.95}
ol.steps li{margin-bottom:7px; padding-inline-start:3px}
ol.steps li::marker{color:var(--brown); font-weight:700}
ul.faq{font-size:.9rem; line-height:1.9}
ul.faq li{margin-bottom:10px}
.hstep code,.faq code{background:var(--sand-2); padding:1px 6px; border-radius:5px; font-size:.85em;
  direction:ltr; unicode-bidi:isolate; display:inline-block}

/* --- الخط الزمني --- */
.tl{position:relative; padding-inline-start:26px}
.tl::before{content:""; position:absolute; inset-inline-start:7px; top:6px; bottom:6px;
  width:2px; background:var(--line)}
.tl .it{position:relative; padding-bottom:16px}
.tl .it::before{content:""; position:absolute; inset-inline-start:-24px; top:6px; width:11px; height:11px;
  border-radius:50%; background:var(--amber); box-shadow:0 0 0 3px var(--sand)}
.tl .it .tt{font-weight:700; font-size:.92rem}
.tl .it .td{font-size:.79rem; color:var(--text-muted)}

/* --- التبويبات --- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:14px; flex-wrap:wrap}
.tabs button{background:none; border:0; padding:8px 14px; font-size:.87rem; font-weight:600;
  color:var(--text-secondary); border-bottom:2.5px solid transparent; border-radius:6px 6px 0 0}
.tabs button:hover{background:var(--sand-2)}
.tabs button.on{color:var(--brown); border-bottom-color:var(--brown)}
.tabpane{display:none} .tabpane.on{display:block}

/* --- النموذج / النافذة --- */
.modal{position:fixed; top:0; right:0; bottom:0; left:0; inset:0; background:rgba(30,22,15,.55); z-index:150; display:none;
  align-items:flex-start; justify-content:center; padding:32px 16px; overflow-y:auto;
  backdrop-filter:blur(2px)}
.modal.on{display:flex}
.modal .box{background:var(--surface-2); border-radius:var(--r); width:100%; max-width:640px;
  box-shadow:var(--sh-2); border:1px solid var(--line); animation:pop .22s ease}
@keyframes pop{from{opacity:0; transform:scale(.96) translateY(-8px)}to{opacity:1; transform:none}}
.modal .mh{padding:15px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center}
.modal .mh h3{margin:0}
.modal .mh button{margin-inline-start:auto; background:none; border:0; font-size:1.4rem;
  color:var(--text-muted); line-height:1}
.modal .mb{padding:18px 20px}
.modal .mf{padding:13px 20px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end}
.field{margin-bottom:13px}
.field label{display:block; font-size:.815rem; font-weight:700; color:var(--text-secondary); margin-bottom:4px}
.field input,.field select,.field textarea{
  width:100%; padding:8px 11px; border:1px solid var(--line); border-radius:8px;
  background:var(--sand); color:var(--ink); font-family:inherit; font-size:.9rem;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--amber); outline-offset:0; border-color:var(--amber)}
.field textarea{min-height:78px; resize:vertical}
.frow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.frow3{display:grid; grid-template-columns:1.4fr 1fr 1.4fr auto; gap:6px; margin-bottom:6px; align-items:center}
.frow3 input,.frow3 select{padding:7px 9px; border:1px solid var(--line); border-radius:8px;
  background:var(--sand); color:var(--ink); font-family:inherit; font-size:.85rem; width:100%}
@media(max-width:640px){.frow3{grid-template-columns:1fr 1fr; }
  .frow3 input:first-child{grid-column:1/3} .frow3 input#fo0,.frow3 input[id^=fo]{grid-column:1/2}}

/* --- الإشعارات --- */
.toasts{position:fixed; bottom:18px; inset-inline-end:18px; z-index:300; display:flex;
  flex-direction:column; gap:8px}
.toast{background:var(--green-d); color:#fff; padding:10px 16px; border-radius:10px;
  box-shadow:var(--sh-2); font-size:.87rem; animation:slide .25s ease; max-width:330px}
.toast.e{background:#8c2e20}
@keyframes slide{from{opacity:0; transform:translateY(14px)}to{opacity:1; transform:none}}

/* --- الخريطة SVG --- */
.mapbox{background:var(--sand-2); border:1px solid var(--line); border-radius:var(--r); padding:10px}
.mapbox svg{width:100%; height:auto; display:block}


/* ============ شاشة الدخول والصلاحيات ============ */
.gate{position:fixed; top:0; right:0; bottom:0; left:0; inset:0; z-index:400; display:flex;
  align-items:center; justify-content:center; padding:18px; overflow-y:auto;
  background:#234636; background:linear-gradient(160deg,#2f5d45,#1b3529 70%,#12241b)}
.gate.off{display:none}
.gbox{background:var(--surface-2); border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.4);
  width:100%; max-width:520px; padding:24px 22px 20px; text-align:center; margin:auto}
.gbox .glogo{width:96px; height:96px; object-fit:contain; background:#fff; border-radius:50%;
  padding:6px; box-shadow:0 4px 16px rgba(0,0,0,.18)}
.gbox .gt{font-size:1.05rem; font-weight:700; margin-top:10px; line-height:1.5}
.gbox .gs{font-size:.82rem; color:var(--text-muted); margin-bottom:14px}
.gate .langsw{margin:9px 0 11px}
.ulist{display:flex; flex-direction:column; gap:7px; text-align:start; max-height:44vh;
  overflow-y:auto; margin-bottom:12px; padding:2px}
.ghead{font-size:.72rem; font-weight:700; color:var(--text-muted); letter-spacing:.5px;
  padding:9px 2px 3px; text-align:start}
.ghead:first-child{padding-top:0}
.ucard{display:flex; align-items:center; gap:10px; width:100%; border:1px solid var(--line);
  background:var(--sand); border-radius:11px; padding:9px 12px; transition:.16s; text-align:start}
.ucard:hover{border-color:var(--brown-l); background:var(--sand-2); transform:translateY(-1px)}
.ucard .av{width:34px; height:34px; flex:0 0 34px; border-radius:50%; background:var(--green);
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:1rem}
.ucard.adm .av{background:var(--brown)}
.ucard .un{font-weight:700; font-size:.9rem; line-height:1.35}
.ucard .ur{font-size:.76rem; color:var(--text-muted)}
.ucard .uk{margin-inline-start:auto; font-size:1rem; color:var(--text-muted)}
.pinrow{display:flex; gap:8px; margin:10px 0}
.pinrow input{flex:1; text-align:center; letter-spacing:8px; font-size:1.25rem; padding:10px;
  border:1px solid var(--line); border-radius:11px; background:var(--sand); color:var(--ink);
  font-family:inherit}
.pinrow input:focus{outline:2px solid var(--amber); border-color:var(--amber)}
.gerr{color:#c2402f; font-size:.84rem; min-height:20px}
.gfoot{font-size:.75rem; color:var(--text-muted); margin-top:10px; line-height:1.6}
.who{display:inline-flex; align-items:center; gap:7px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:20px; padding:3px 5px 3px 11px; box-shadow:var(--sh-1)}
[dir=ltr] .who{padding:3px 11px 3px 5px}
.who .av{width:25px; height:25px; border-radius:50%; background:var(--green); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:.8rem; flex:0 0 25px}
.who.adm .av{background:var(--brown)}
.who .wn{font-size:.79rem; font-weight:700; line-height:1.2; max-width:130px; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap}
.who .wr{font-size:.68rem; color:var(--text-muted); line-height:1.2}
.ro{background:var(--sand-2); border:1px dashed var(--line); border-radius:var(--r-s);
  padding:8px 12px; font-size:.83rem; color:var(--text-secondary); margin-bottom:11px}
.checks{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr)); gap:5px;
  border:1px solid var(--line); border-radius:9px; padding:9px; max-height:190px; overflow-y:auto;
  background:var(--sand)}
.checks label{display:flex; align-items:center; gap:6px; font-size:.83rem; font-weight:400;
  margin:0; cursor:pointer}
.checks input{width:auto; margin:0}
.compatwarn{background:#fdf2dd; color:#8a5c10; border:1px solid #f2ddb0; border-radius:10px;
  padding:9px 13px; font-size:.83rem; margin-bottom:14px}
html[data-theme="dark"] .compatwarn{background:#332711;color:#e5bd6b;border-color:#4d3a1a}
.bootfail{max-width:620px; margin:60px auto; padding:22px; border:1px solid #f2c9c0;
  background:#fbe8e4; color:#8c2e20; border-radius:14px; font-size:.9rem; line-height:1.8}

/* --- زر القائمة للجوال --- */
.menubtn{display:none; background:var(--green); color:#fff; border:0; border-radius:9px;
  width:36px; height:33px; font-size:1.05rem}
.scrim{display:none; position:fixed; top:0; right:0; bottom:0; left:0; inset:0; background:rgba(0,0,0,.45); z-index:35}
.scrim.on{display:block}
@media(max-width:980px){
  .side{position:fixed; top:0; transition:transform .25s}
  [dir="rtl"] .side{right:0; left:auto; transform:translateX(100%)}
  [dir="ltr"] .side{left:0; right:auto; transform:translateX(-100%)}
  .side.on{transform:none}
  .menubtn{display:inline-flex; align-items:center; justify-content:center}
  .content{padding:14px 13px 50px}
  .topbar{padding:9px 13px}
  .searchbox input{width:150px}
  .searchbox input:focus{width:190px}
  .hero .ov{padding:22px}
  .hero .ov h1{font-size:1.4rem}
  .deflist{grid-template-columns:1fr; gap:0}
  .deflist dt{border-bottom:0; padding-bottom:0}
  .frow{grid-template-columns:1fr}
  .lightbox{padding:52px 12px 60px}
  .lbnav{width:40px; height:40px; font-size:1.4rem}
  .lbnav.a{inset-inline-start:6px} .lbnav.b{inset-inline-end:6px}
  .lbcap{padding:0 14px; font-size:.83rem}
  .strip img{height:88px; max-width:150px}
  .hero .dots{bottom:8px}
  .gbox{padding:18px 15px 15px; border-radius:14px}
  .gbox .glogo{width:76px; height:76px}
  .ulist{max-height:38vh}
  .who .wn{max-width:92px}
  .checks{grid-template-columns:1fr 1fr}
}
@media(max-width:400px){
  body{font-size:15px}
  .content{padding:11px 9px 44px}
  .card{padding:13px; border-radius:11px}
  .grid{gap:11px}
  .kpi .kv{font-size:1.6rem}
  .topbar{padding:8px 9px; gap:8px}
  .topbar h1{font-size:1.02rem}
  .searchbox input{width:120px}
  .searchbox input:focus{width:150px}
  .who .wn{max-width:70px}
  .bar-row{grid-template-columns:minmax(70px,102px) 1fr auto; gap:7px}
  .bar-row .bl{font-size:.78rem}
  .hero{min-height:210px!important}
  .hero .ov{padding:16px}
  .hero .ov h1{font-size:1.15rem}
  .hero .logo{width:64px; height:64px}
  .modal{padding:16px 8px}
  .modal .mb{padding:14px 13px}
  .g2,.g3,.g4{grid-template-columns:1fr}
}
@media print{
  .side,.topbar,.toolbar,.ops,.menubtn,.toasts{display:none!important}
  .page{display:none!important} .page.on{display:block!important}
  body{background:#fff} .card{break-inside:avoid; box-shadow:none}
}
</style>

uni_note:["<b>كيف يعمل:</b> يكتب العضو الرمز الموحد مرة واحدة، ثم يختار اسمه من القائمة فيدخل مباشرة إلى أقسامه. رمز واحد تحفظه اللجان كلها، مع بقاء هوية كل عضو محفوظة في سجل النشاط.","<b>Fonctionnement :</b> le membre saisit une fois le code unifié, puis choisit son nom dans la liste et accède directement à ses sections. Un seul code pour toutes les commissions, tout en conservant l'identité de chacun dans le journal d'activité.","<b>How it works:</b> a member enters the shared code once, then picks their name from the list and goes straight to their sections. One code for all committees, while each person's identity is still recorded in the activity log."],
uni_warn:["<b>انتبه:</b> الرمز الموحد يعني أن من يعرفه يستطيع اختيار أي اسم في القائمة. فهو مناسب لتسهيل العمل داخل فريق يثق ببعضه، لا لحماية بيانات حسّاسة. أبقِ حساب المدير العام محمياً برمزه الخاص، وغيّر الرمز الموحد بعد كل دورة.","<b>Attention :</b> quiconque connaît le code unifié peut choisir n'importe quel nom de la liste. Cela facilite le travail d'une équipe de confiance mais ne protège pas des données sensibles. Gardez le compte administrateur protégé par son propre code et changez le code unifié après chaque édition.","<b>Note:</b> anyone who knows the shared code can pick any name from the list. This suits a trusted team but does not protect sensitive data. Keep the administrator account on its own passcode, and change the shared code after each edition."],

pub_title:["نشر البيانات لجميع الأعضاء","Publier les données pour tous","Publish data to everyone"],
pub_why:["تعديلاتك محفوظة على جهازك أنت فقط. لتظهر لكل من يفتح الرابط، نزّل <b>ملف النشر</b> وارفعه في المستودع بجانب <code>index.html</code> — فتتبنّاه أجهزة الأعضاء تلقائياً عند فتح الرابط.","Vos modifications sont enregistrées uniquement sur votre appareil. Pour qu'elles apparaissent à tous, téléchargez le <b>fichier de publication</b> et déposez-le dans le dépôt à côté de <code>index.html</code> — les appareils des membres l'adopteront automatiquement.","Your changes are saved only on your device. To make them visible to everyone, download the <b>publish file</b> and upload it to the repository next to <code>index.html</code> — members' devices will adopt it automatically."],
pub_btn:["تنزيل ملف النشر (data.json)","Télécharger le fichier de publication (data.json)","Download publish file (data.json)"],
pub_done:["نُزّل ملف النشر — ارفعه الآن في المستودع","Fichier téléchargé — déposez-le maintenant dans le dépôt","File downloaded — now upload it to the repository"],
pub_steps:["<b>الخطوات:</b> افتح المستودع ← Add file ← Upload files ← اسحب <code>data.json</code> ← Commit changes. ثم اطلب من الأعضاء إعادة فتح الرابط.","<b>Étapes :</b> ouvrez le dépôt ← Add file ← Upload files ← déposez <code>data.json</code> ← Commit changes. Demandez ensuite aux membres de rouvrir le lien.","<b>Steps:</b> open the repository ← Add file ← Upload files ← drop <code>data.json</code> ← Commit changes. Then ask members to reopen the link."],

pub_prev:["استرجاع آخر نسخة كانت على هذا الجهاز","Restaurer la dernière version de cet appareil","Restore this device's previous version"],

pub_noPrev:["لا توجد نسخة سابقة على هذا الجهاز","Aucune version précédente sur cet appareil","No previous version on this device"],
pub_note:["<b>القاعدة:</b> الملف المنشور هو المرجع للجميع. من يعدّل على جهازه ولم يُنشر، تظل تعديلاته عنده وحده — ويرسلها للمدير العام عبر النسخة الاحتياطية ليضمّها ويعيد النشر.","<b>Règle :</b> le fichier publié fait référence pour tous. Les modifications non publiées restent locales — envoyez-les à l'administrateur via la sauvegarde JSON pour qu'il les intègre et republie.","<b>Rule:</b> the published file is the reference for everyone. Unpublished changes stay local — send them to the administrator via the JSON backup so they can be merged and republished."],
pub_warnLocal:["تنبيه: تبنّي النسخة المنشورة يستبدل ما على جهازك. إن كان لديك عمل لم تُرسله، استرجعه بالزر أدناه ثم صدّر نسخة احتياطية وأرسلها للمدير العام.","Attention : adopter la version publiée remplace ce qui est sur votre appareil. Si vous aviez du travail non transmis, restaurez-le ci-dessous puis exportez une sauvegarde à envoyer à l'administrateur.","Note: adopting the published version replaces what is on your device. If you had unsent work, restore it below, then export a backup and send it to the administrator."],

in_members:["سجّل هنا أعضاء لجنتك بأسمائهم وصفاتهم وهواتفهم. استعمل مُصفّي «اللجنة» أعلى الجدول لعرض أعضاء لجنتك وحدها.","Enregistrez ici les membres de votre commission avec leur qualité et leur téléphone. Utilisez le filtre « Commission » au-dessus du tableau pour n'afficher que la vôtre.","Register your committee's members here with their role and phone. Use the “Committee” filter above the table to show only your own."],
in_plan:["خطة عمل لجنتك: كل مهمة ومن يتولاها وموعدها ونسبة إنجازها. حدّث نسبة الإنجاز أولاً بأول ليتابعها المدير العام.","Le plan d'action de votre commission : chaque tâche, son responsable, son échéance et son taux d'avancement. Mettez-le à jour régulièrement pour le suivi de la direction.","Your committee's work plan: each task, who owns it, its deadline and its progress. Keep the progress updated so management can follow it."],
pl_prog:["تقدم المهام","Avancement des tâches","Task progress"],
pl_leg:["نسبة الإنجاز لكل مهمة","Taux d'avancement par tâche","Completion rate per task"],
pl_late:["مهام متأخرة","Tâches en retard","Overdue tasks"],
pl_open:["مهام جارية","Tâches en cours","Ongoing tasks"],
pl_doneN:["مهام منجزة","Tâches achevées","Completed tasks"],
mb_total:["إجمالي الأعضاء المسجَّلين","Total des membres enregistrés","Total registered members"],
mb_byBody:["الأعضاء حسب اللجنة","Membres par commission","Members per committee"],
/* ---- دليل الاستخدام داخل المنصة ---- */
hp_intro:["هذا الدليل يشرح لك كل ما تحتاجه للعمل على المنصة خطوة بخطوة. اقرأه مرة واحدة وستستغني عنه.","Ce guide explique pas à pas tout ce dont vous avez besoin. Une seule lecture suffira.","This guide walks you through everything you need, step by step. One read should be enough."],
hp_forWho:["للرؤساء والأعضاء","Pour les présidents et membres","For chairs and members"],
hp_forAdmin:["للمدير العام خاصة","Pour l'administrateur général","For the super administrator"],
hp_pdf:["الدليل المصوّر","Guide illustré","Illustrated guide"],
hp_print:["طباعة الدليل","Imprimer le guide","Print the guide"],

h1t:["1 · كيف تدخل إلى المنصة؟","1 · Comment se connecter ?","1 · How to sign in"],
h1a:["افتح الرابط الذي وصلك في متصفح الجوال أو الحاسوب.","Ouvrez le lien reçu dans le navigateur de votre téléphone ou ordinateur.","Open the link you received in your phone or computer browser."],
h1b:["اكتب <b>الرمز الموحد</b> الذي سلّمك إياه المدير العام، ثم اضغط «دخول».","Saisissez le <b>code unifié</b> remis par l'administrateur, puis « Se connecter ».","Enter the <b>shared passcode</b> given to you by the administrator, then tap “Sign in”."],
h1c:["تظهر قائمة الأسماء مرتّبة في ثلاث مجموعات — ابحث عن <b>اسمك أو منصبك</b> واضغط عليه، فتدخل مباشرة.","Une liste de noms apparaît en trois groupes — touchez <b>votre nom ou fonction</b> pour entrer directement.","A list of names appears in three groups — tap <b>your name or position</b> to go straight in."],
h1d:["<b>لتخرج:</b> اضغط الزر ⎋ أعلى الصفحة.","<b>Pour quitter :</b> appuyez sur ⎋ en haut de la page.","<b>To sign out:</b> tap ⎋ at the top of the page."],

h2t:["2 · ما الذي تراه في صفحتك؟","2 · Que voyez-vous sur votre page ?","2 · What you see on your page"],
h2a:["<b>القائمة الجانبية</b> (تفتحها في الجوال بزر ☰): فيها أقسامك أنت فقط. الأقسام التي لا تخصّك لا تظهر لك أصلاً.","<b>Le menu latéral</b> (bouton ☰ sur mobile) : il ne contient que vos sections. Les autres ne s'affichent pas.","<b>The side menu</b> (☰ button on mobile): it shows only your sections. Sections that aren't yours don't appear."],
h2b:["<b>لوحة القيادة</b>: أرقام سريعة عن المهرجان كله، ويظهر فيها سطر «أقسامي» يذكّرك بما تديره.","<b>Le tableau de bord</b> : chiffres clés du festival, avec une ligne « Mes sections ».","<b>The dashboard</b>: quick festival-wide numbers, with a “My sections” line reminding you what you manage."],
h2c:["<b>الرقم بجانب كل قسم</b> في القائمة هو عدد السجلات المسجَّلة فيه.","<b>Le nombre à côté de chaque section</b> indique le nombre d'enregistrements.","<b>The number beside each section</b> is how many records it holds."],
h2d:["إن رأيت شريطاً مكتوباً فيه «لديك صلاحية الاطلاع فقط» فهذا القسم للقراءة، والتعديل فيه لغيرك.","Si vous voyez « accès en lecture seule », cette section est consultable mais non modifiable par vous.","If you see “read-only access”, that section is view-only for you."],

h3t:["3 · كيف تضيف سجلاً جديداً؟ (القاعدة نفسها في كل الأقسام)","3 · Comment ajouter un enregistrement ? (même principe partout)","3 · How to add a record (same in every section)"],
h3a:["افتح القسم من القائمة الجانبية.","Ouvrez la section depuis le menu latéral.","Open the section from the side menu."],
h3b:["اضغط الزر البني أعلى الجدول: <b>«＋ إضافة — …»</b>.","Appuyez sur le bouton brun au-dessus du tableau : <b>« ＋ Ajouter — … »</b>.","Tap the brown button above the table: <b>“＋ Add — …”</b>."],
h3c:["تفتح استمارة. املأ الحقول — الحقل الأول إلزامي، والباقي تكمله متى توفّر لديك.","Un formulaire s'ouvre. Le premier champ est obligatoire, les autres peuvent être complétés plus tard.","A form opens. The first field is required; the rest can be filled in later."],
h3d:["اضغط <b>«حفظ»</b>، فيظهر السجل في الجدول فوراً.","Appuyez sur <b>« Enregistrer »</b> ; l'enregistrement apparaît aussitôt.","Tap <b>“Save”</b> and the record appears immediately."],

h4t:["4 · كيف تعدّل سجلاً؟","4 · Comment modifier ?","4 · How to edit"],
h4a:["في آخر عمود من الجدول ستجد زر <b>«تعديل»</b> أمام كل سطر.","Dans la dernière colonne du tableau, un bouton <b>« Modifier »</b> figure sur chaque ligne.","In the table's last column, each row has an <b>“Edit”</b> button."],
h4b:["اضغطه، غيّر ما تريد، ثم <b>«حفظ»</b>.","Appuyez, modifiez, puis <b>« Enregistrer »</b>.","Tap it, change what you need, then <b>“Save”</b>."],
h4c:["<b>في الجوال:</b> اسحب الجدول إلى اليسار بإصبعك حتى يظهر عمود «إجراءات».","<b>Sur mobile :</b> faites glisser le tableau vers la gauche pour voir la colonne « Actions ».","<b>On mobile:</b> swipe the table sideways to reveal the “Actions” column."],

h5t:["5 · كيف تحذف سجلاً؟","5 · Comment supprimer ?","5 · How to delete"],
h5a:["اضغط زر <b>«حذف»</b> الأحمر أمام السطر، ثم أكّد في النافذة التي تظهر.","Appuyez sur <b>« Supprimer »</b> puis confirmez dans la fenêtre.","Tap the red <b>“Delete”</b> button, then confirm in the dialog."],
h5b:["إن لم تجد زر الحذف فذلك لأن صلاحيتك لا تشمله — اطلبه من المدير العام. هذا مقصود حتى لا تُفقد بيانات بالخطأ.","Si le bouton n'apparaît pas, votre profil n'a pas ce droit — demandez-le à l'administrateur. C'est volontaire, pour éviter les pertes accidentelles.","If you don't see it, your account lacks that right — ask the administrator. This is deliberate, to prevent accidental loss."],

h6t:["6 · كيف تضيف أعضاء لجنتك؟","6 · Comment ajouter les membres de votre commission ?","6 · How to add your committee's members"],
h6a:["افتح قسم <b>«أعضاء اللجان»</b> من القائمة.","Ouvrez la section <b>« Membres des commissions »</b>.","Open the <b>“Committee members”</b> section."],
h6b:["اضغط <b>«＋ إضافة — عضو»</b>، ثم اكتب: الاسم الكامل، واسم <b>لجنتك</b>، وصفته (رئيس، نائب، مقرر، أمين مال، عضو…)، وهاتفه.","Appuyez sur <b>« ＋ Ajouter — un membre »</b> puis saisissez : nom complet, nom de <b>votre commission</b>, qualité et téléphone.","Tap <b>“＋ Add — member”</b> then enter: full name, <b>your committee's</b> name, role and phone."],
h6c:["اكتب اسم لجنتك <b>بالطريقة نفسها في كل مرة</b> حتى تتجمّع أسماء أعضائك تحت لجنة واحدة.","Écrivez le nom de votre commission <b>toujours de la même manière</b> pour regrouper vos membres.","Type your committee's name <b>the same way every time</b> so your members group together."],
h6d:["لعرض أعضاء لجنتك وحدهم: استعمل القائمة المنسدلة أعلى الجدول واختر اسم لجنتك.","Pour n'afficher que vos membres : utilisez la liste déroulante au-dessus du tableau.","To show only your members: use the dropdown above the table and pick your committee."],

h7t:["7 · كيف تضيف خطة عمل لجنتك؟","7 · Comment saisir votre plan d'action ?","7 · How to enter your work plan"],
h7a:["افتح قسم <b>«خطط العمل والمهام»</b>.","Ouvrez la section <b>« Plans d'action et tâches »</b>.","Open the <b>“Work plans & tasks”</b> section."],
h7b:["أضف <b>مهمة واحدة في كل سجل</b> — لا تكتب الخطة كلها في سطر واحد.","Saisissez <b>une tâche par enregistrement</b> — n'écrivez pas tout le plan sur une ligne.","Add <b>one task per record</b> — don't cram the whole plan into one line."],
h7c:["لكل مهمة: عنوانها، اسم لجنتك، المكلَّف بتنفيذها، تاريخ البدء، الموعد النهائي، والأولوية.","Pour chaque tâche : intitulé, commission, responsable, dates de début et d'échéance, priorité.","For each task: its title, your committee, who owns it, start and due dates, and priority."],
h7d:["<b>الأهم:</b> ارجع كل أسبوع وحدّث <b>نسبة الإنجاز</b> و<b>الحالة</b> (لم تبدأ / جارية / منجزة / متأخرة). هذه الأرقام هي التي يتابعها المدير العام في لوحة القيادة.","<b>Le plus important :</b> mettez à jour chaque semaine <b>l'avancement</b> et <b>l'état</b>. Ce sont ces chiffres que la direction suit.","<b>Most important:</b> update the <b>progress</b> and <b>status</b> weekly. These are the numbers management follows."],

h8t:["8 · البحث والتصفية والطباعة","8 · Recherche, filtrage et impression","8 · Search, filter and print"],
h8a:["<b>البحث الشامل</b> أعلى الصفحة يبحث في كل أقسامك دفعة واحدة.","<b>La recherche globale</b> en haut cherche dans toutes vos sections à la fois.","<b>Global search</b> at the top searches all your sections at once."],
h8b:["<b>خانة «تصفية»</b> فوق كل جدول تبحث داخل ذلك القسم فقط.","<b>Le champ « Filtrer »</b> au-dessus de chaque tableau cherche dans cette section seulement.","<b>The “Filter” box</b> above each table searches within that section only."],
h8c:["<b>«تصدير CSV»</b> ينزّل الجدول ليُفتح في Excel.","<b>« Exporter CSV »</b> télécharge le tableau pour Excel.","<b>“Export CSV”</b> downloads the table for Excel."],
h8d:["<b>«طباعة»</b> يطبع القسم المعروض، ويصلح لعمل ملف PDF من الجوال.","<b>« Imprimer »</b> imprime la section affichée et permet d'en faire un PDF.","<b>“Print”</b> prints the current section and can produce a PDF."],

h9t:["9 · كيف ترسل عملك إلى المدير العام؟ (مهم جداً)","9 · Comment transmettre votre travail à l'administrateur ? (très important)","9 · How to send your work to the administrator (very important)"],
h9a:["تعديلاتك تُحفظ في <b>جهازك أنت</b>، ولا يراها بقية الأعضاء تلقائياً.","Vos modifications sont enregistrées <b>sur votre appareil</b> et ne sont pas visibles par les autres.","Your changes are saved <b>on your own device</b> and are not automatically visible to others."],
h9b:["بعد أن تنهي إدخال بياناتك: <b>الإعدادات والنسخ ← تنزيل نسخة احتياطية (JSON)</b>.","Une fois vos saisies terminées : <b>Paramètres ← Télécharger une sauvegarde (JSON)</b>.","When you finish entering data: <b>Settings ← Download backup (JSON)</b>."],
h9c:["أرسل الملف للمدير العام في واتساب. هو يضمّه إلى بيانات المهرجان ثم ينشره فيصل إلى الجميع.","Envoyez le fichier à l'administrateur (WhatsApp). Il l'intègre puis le publie pour tous.","Send the file to the administrator on WhatsApp. He merges it and publishes it to everyone."],
h9d:["إن ظهرت لك رسالة «وصلت نسخة محدَّثة من إدارة المهرجان» فمعناها أن بيانات المهرجان تحدّثت عندك — وهذا طبيعي.","Le message « version mise à jour reçue » signifie que les données ont été actualisées — c'est normal.","The message “an updated version was received” means the data was refreshed — that's normal."],

h10t:["10 · تثبيت المنصة كتطبيق على جوالك","10 · Installer la plateforme comme application","10 · Install the platform as an app"],
h10a:["<b>أندرويد:</b> من قائمة المتصفح ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».","<b>Android :</b> menu du navigateur ← « Installer l'application ».","<b>Android:</b> browser menu ← “Install app”."],
h10b:["<b>آيفون:</b> زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية».","<b>iPhone :</b> bouton Partager ⬆️ ← « Sur l'écran d'accueil ».","<b>iPhone:</b> Share button ⬆️ ← “Add to Home Screen”."],
h10c:["تصبح المنصة أيقونة بشعار المهرجان وتعمل حتى بلا إنترنت.","La plateforme devient une icône et fonctionne même hors ligne.","The platform becomes an icon and works even offline."],

h11t:["11 · للمدير العام: نشر البيانات للجميع","11 · Administrateur : publier les données","11 · Administrator: publishing data"],
h11a:["اجمع نسخ اللجان (JSON) واستوردها من <b>الإعدادات ← استرجاع نسخة</b>.","Rassemblez les sauvegardes des commissions et importez-les via <b>Paramètres ← Restaurer</b>.","Collect the committees' backups and import them via <b>Settings ← Restore backup</b>."],
h11b:["ثم <b>الإعدادات ← نشر البيانات ← تنزيل ملف النشر (data.json)</b>.","Puis <b>Paramètres ← Publier ← Télécharger data.json</b>.","Then <b>Settings ← Publish ← Download data.json</b>."],
h11c:["ارفع <code>data.json</code> في المستودع بجانب <code>index.html</code>، واطلب من الأعضاء إعادة فتح الرابط.","Déposez <code>data.json</code> dans le dépôt à côté de <code>index.html</code>, puis demandez aux membres de rouvrir le lien.","Upload <code>data.json</code> to the repository next to <code>index.html</code>, then ask members to reopen the link."],

h12t:["أسئلة يكثر سؤالها","Questions fréquentes","Frequently asked"],
q1:["<b>لا أرى قسماً ذكره زميلي.</b> الأقسام تُعرض حسب صلاحيتك — اطلب من المدير العام إضافته لك.","<b>Je ne vois pas une section citée par un collègue.</b> Les sections dépendent de vos droits — demandez à l'administrateur.","<b>I can't see a section a colleague mentioned.</b> Sections depend on your permissions — ask the administrator."],
q2:["<b>لا أجد زر الإضافة.</b> إما أنك دخلت كزائر، أو صلاحيتك في هذا القسم للاطلاع فقط.","<b>Le bouton Ajouter est absent.</b> Vous êtes entré comme invité ou votre accès est en lecture seule.","<b>No Add button.</b> Either you entered as a guest, or your access there is read-only."],
q3:["<b>أدخلت بيانات ثم اختفت.</b> غالباً استعملت متصفحاً آخر أو وضع التصفح الخفي. استعمل المتصفح نفسه دائماً، وتأكد أن «الحفظ التلقائي» مفعّل في الإعدادات.","<b>Mes données ont disparu.</b> Vous avez sans doute changé de navigateur ou utilisé la navigation privée. Gardez le même navigateur et vérifiez la sauvegarde automatique.","<b>My data disappeared.</b> You probably used a different browser or private mode. Always use the same browser and check that auto-save is on."],
q4:["<b>هل يمكنني الكتابة بالفرنسية أو الإنجليزية؟</b> نعم — بدّل اللغة من الأعلى، وما تكتبه يُحفظ في اللغة المعروضة، ويبقى النص في اللغتين الأخريين كما هو.","<b>Puis-je saisir en français ou anglais ?</b> Oui — changez la langue en haut ; la saisie est enregistrée dans la langue affichée.","<b>Can I type in French or English?</b> Yes — switch the language at the top; your text is saved for the displayed language."],
q5:["<b>نسيت الرمز.</b> اطلبه من المدير العام؛ وهو يستطيع تغييره لك في ثوانٍ.","<b>J'ai oublié le code.</b> Demandez-le à l'administrateur, il peut le changer en quelques secondes.","<b>I forgot the passcode.</b> Ask the administrator; they can change it in seconds."],
q6:["<b>هل أستطيع العمل بلا إنترنت؟</b> نعم بعد أول فتح للرابط — والبيانات تُحفظ في جهازك حتى ترجع الشبكة.","<b>Puis-je travailler hors ligne ?</b> Oui après la première ouverture ; les données restent sur votre appareil.","<b>Can I work offline?</b> Yes after the first visit; data stays on your device."],
langSwitchNote:["اللغة الحالية تُحفظ داخل النسخة الاحتياطية.","La langue courante est conservée dans la sauvegarde.","The current language is stored in the backup."]
};
</script>

rg_quote:["هذا ضريح الشيخ سيدي ببكر، جد سكان مركز الرشيد الإداري.","Voici le mausolée de Cheikh Sidi Boubakr, ancêtre des habitants du centre administratif d'Er-Rachid.","This is the mausoleum of Sheikh Sidi Boubakr, ancestor of the people of Er-Rachid administrative centre."],
rg_geo:["الجغرافيا","Géographie","Geography"],
rg_geo_p:["تنتمي المنطقة إلى <b>هضبة تكانت</b> في وسط موريتانيا: تضاريس من سفوح صخرية ومنحدرات، وأودية وشعاب موسمية، وسهول رملية وكثبان زاحفة، وواحات نخيل في المنخفضات المائية.","La région appartient au <b>plateau du Tagant</b>, au centre de la Mauritanie : versants rocheux et escarpements, oueds et ravins saisonniers, plaines sableuses et dunes mobiles, palmeraies dans les dépressions humides.","The area belongs to the <b>Tagant plateau</b> in central Mauritania: rocky slopes and escarpments, seasonal wadis and gullies, sandy plains and shifting dunes, and palm groves in water-bearing depressions."],
rg_geo_b1:["مناخ صحراوي حار وجاف، أمطار صيفية ضعيفة وغير منتظمة.","Climat désertique chaud et sec, pluies d'été faibles et irrégulières.","Hot, dry desert climate with weak and irregular summer rains."],
rg_geo_b2:["غطاء نباتي متناثر: أشجار السدر والطلح والأعشاب الموسمية.","Couvert végétal clairsemé : jujubiers, acacias et herbes saisonnières.","Sparse vegetation: jujube, acacia and seasonal grasses."],
rg_geo_b3:["زحف الرمال أبرز تهديد للمواقع الأثرية والواحات.","L'ensablement est la principale menace pour les sites archéologiques et les palmeraies.","Sand encroachment is the main threat to archaeological sites and palm groves."],
rg_geo_note:["تظهر صور الموقع أثر زحف الرمال على السور الحجري المحيط بالضريح — وهو ما يجعل التسييج والحماية أولوية.","Les photographies du site montrent l'effet de l'ensablement sur le mur de pierre entourant le mausolée — d'où la priorité donnée à la clôture et à la protection.","Photographs of the site show sand encroaching on the stone wall around the mausoleum — which is why fencing and protection are a priority."],
rg_gs:["الصحراء الخضراء","Le Sahara vert (Green Sahara)","The Green Sahara"],
rg_gs_p1:["تعود أقدم شواهد المنطقة غالباً إلى فترة <b>«الصحراء الخضراء»</b>، وهي حقبة رطبة امتدت تقريباً من <b>10.000 إلى 3.000 سنة قبل الميلاد</b>، حين كانت الصحراء الكبرى مليئة بالبحيرات والأعشاب والحيوانات البرية بدل الرمال الحالية.","Les témoignages les plus anciens de la région remontent vraisemblablement à la période du <b>« Sahara vert »</b>, une phase humide s'étendant approximativement de <b>10 000 à 3 000 av. J.-C.</b>, lorsque le Sahara était couvert de lacs, de prairies et d'une faune sauvage abondante au lieu des sables actuels.","The region's earliest evidence most likely dates to the <b>“Green Sahara”</b>, a humid phase running roughly from <b>10,000 to 3,000 BC</b>, when the Sahara held lakes, grasslands and abundant wildlife instead of today's sands."],
rg_gs_p2:["ولهذا تحفل الملاجئ الصخرية بالمنطقة بمشاهد أبقار ورعاة وصيادين — وثيقة بصرية على مناخٍ مضى.","C'est pourquoi les abris sous roche de la région abondent en scènes de bovins, de bergers et de chasseurs — un document visuel d'un climat révolu.","This is why the region's rock shelters abound with scenes of cattle, herders and hunters — a visual record of a vanished climate."],
rg_pop:["الساكنة","La population","The population"],
rg_pop_p:["مجتمع <b>واحاتي رعوي</b>، تتوزع أسره بين المدينة القديمة والمخيمات والواحات المجاورة، وترتبط ساكنة <b>مركز الرشيد الإداري</b> بجدٍّ جامع هو <b>الشيخ سيدي ببكر</b> الذي يقوم ضريحه بالموقع.","Une société <b>oasienne et pastorale</b> dont les familles se répartissent entre la vieille ville, les campements et les palmeraies voisines ; les habitants du <b>centre administratif d'Er-Rachid</b> se rattachent à un ancêtre commun, <b>Cheikh Sidi Boubakr</b>, dont le mausolée se trouve sur le site.","An <b>oasis and pastoral</b> society whose families are spread between the old town, the camps and the neighbouring palm groves; the people of the <b>Er-Rachid administrative centre</b> trace their descent to a common ancestor, <b>Sheikh Sidi Boubakr</b>, whose mausoleum stands at the site."],
rg_pop_b1:["نمط استيطان مزدوج: استقرار حول الواحات وترحال موسمي للمراعي.","Double mode d'habitat : sédentarité autour des palmeraies et transhumance saisonnière vers les pâturages.","A dual settlement pattern: sedentary life around the palm groves and seasonal movement to pastures."],
rg_pop_b2:["تقاليد المحضرة: تعليم القرآن والفقه والنحو والشعر.","Tradition de la mahdhara : enseignement du Coran, du droit, de la grammaire et de la poésie.","The mahdhara tradition: teaching Quran, jurisprudence, grammar and poetry."],
rg_pop_b3:["روابط قوية مع الجاليات المهاجرة داخل البلاد وخارجها.","Liens étroits avec les communautés émigrées, à l'intérieur du pays et à l'étranger.","Strong ties with emigrant communities inside the country and abroad."],

rg_mem_note:["هذه الطبقات مقترح إطارٍ للعرض المتحفي والبحث الميداني؛ التأريخ الدقيق للنقوش والمواقع يحتاج دراسة متخصصة تُدرج في <b>قسم العلوم والتنمية</b>.","Ces strates constituent une proposition de cadre pour la muséographie et la recherche de terrain ; la datation précise des inscriptions et des sites requiert une étude spécialisée à inscrire au <b>département sciences et développement</b>.","These layers are a proposed framework for museum display and fieldwork; precise dating of the inscriptions and sites requires specialist study, to be registered in the <b>Science & development</b> department."],

g1:["<b>إحياء التراث:</b> صون الموروث المادي واللامادي وتوثيقه ونقله للأجيال.","<b>Faire revivre le patrimoine :</b> préserver l'héritage matériel et immatériel, le documenter et le transmettre.","<b>Reviving heritage:</b> safeguarding tangible and intangible heritage, documenting it and passing it on."],
g2:["<b>حماية الآثار:</b> جرد المواقع والقطع، والتسييج، والرقمنة، والتحسيس بقيمتها.","<b>Protéger les vestiges :</b> inventaire des sites et objets, clôture, numérisation et sensibilisation.","<b>Protecting antiquities:</b> inventorying sites and objects, fencing, digitisation and awareness-raising."],

function termC(v){

  if(c) return tv(c);
  return term(s);
}

function toast(msg,err){
  const t=document.createElement("div"); t.className="toast"+(err?" e":""); t.textContent=msg;
  document.getElementById("toasts").appendChild(t);
  setTimeout(()=>{t.style.opacity=0; t.style.transform="translateY(10px)"; t.style.transition=".3s";
    setTimeout(()=>t.remove(),320)},2600);
}
function statusClass(v){
  const s=String(v||"");
  if(/منجز|منجزة|مُسلَّمة|معتمد|متاح|شراكة قائمة|مباشر|مقبول|محصل|أنجزت|متوفر/.test(s)) return "t-ok";
  if(/جارٍ|جارية|قيد التنفيذ|قيد التواصل|قيد الإعداد|قيد التحكيم|قيد الدراسة|تعمل|مصادق/.test(s)) return "t-run";
  if(/مبرمج|مقترح|مفتوحة|متوقع|مقدر|قائمة|جديد|موسمي|محدود|مُسلَّم/.test(s)) return "t-wait";
  if(/ملغى|ملغاة|مرفوض|متوقف|متوقفة|غير متوفر|شاغر/.test(s)) return "t-bad";
  return "t-off";
}

/* =========================================================================
   التسميات القابلة للتعديل — تغيّر المعروض دون المساس بالمفاتيح المخزَّنة
   ========================================================================= */
function CU(){ if(!DB.custom) DB.custom={titles:{},ones:{},fields:{},terms:{},options:{}};
  ["titles","ones","fields","terms","options"].forEach(function(k){if(!DB.custom[k])DB.custom[k]={}});
  return DB.custom; }
/* عنوان القسم */
function secTitle(k){
  const c=CU().titles[k]; if(c) return tv(c);
  if(SCHEMA[k]) return tv(SCHEMA[k].title);
  return UI["p_"+k]?T("p_"+k):k;
}
/* اسم العنصر الواحد */
function secOne(k){const c=CU().ones[k]; return c?tv(c):(SCHEMA[k]?tv(SCHEMA[k].one):"")}
/* تسمية الحقل */
function fLabel(sec,fl){const c=CU().fields[sec+"."+fl.k]; return c?tv(c):tv(fl.l)}
/* خيارات القائمة = الأصلية + المضافة */
function fOpts(sec,fl){return (fl.o||[]).concat(CU().options[sec+"."+fl.k]||[])}
/* تسمية القسم في القائمة الجانبية وعنوان الصفحة */
function navLabel(k){
  const c=CU().titles[k]; if(c) return tv(c);
  if(UI["p_"+k]) return T("p_"+k);
  return SCHEMA[k]?tv(SCHEMA[k].title):k;
}
/* =========================================================================
   الحفظ على الجهاز (اختياري) وتثبيت التطبيق
   ========================================================================= */
const LS_KEY="hweitat.platform.v1";
let AUTOSAVE=true;
const HAS_LS=(function(){try{localStorage.setItem("__t","1");localStorage.removeItem("__t");return true}
  catch(e){return false}})();
function saveLocal(){
  if(!HAS_LS||!AUTOSAVE) return;
  try{localStorage.setItem(LS_KEY,JSON.stringify({v:1,lang:LANGS[LI].c,cfg:CFG,db:DB}))}catch(e){}
}
function loadLocal(){
  if(!HAS_LS) return false;
  try{
    const s=localStorage.getItem(LS_KEY); if(!s) return false;
    const o=JSON.parse(s); if(!o||o.v!==1) return false;
    if(o.cfg) Object.assign(CFG,o.cfg);
    if(o.db){Object.keys(o.db).forEach(k=>{if(Array.isArray(o.db[k])) DB[k]=o.db[k]});
      if(o.db.custom&&typeof o.db.custom==="object") DB.custom=Object.assign(CU(),o.db.custom);}
    applyCustom();
    const li=LANGS.map(l=>l.c).indexOf(o.lang); if(li>=0) LI=li;
    return true;
  }catch(e){return false}
}
function toggleSave(){AUTOSAVE=!AUTOSAVE; if(AUTOSAVE) saveLocal(); go("settings")}
function wipeLocal(){try{localStorage.removeItem(LS_KEY)}catch(e){} AUTOSAVE=false; toast(T("stWiped"))}

/* =========================================================================
   نشر البيانات: ملف data.json بجانب index.html يراه كل من يفتح الرابط
   ========================================================================= */
const PUB_KEY="hweitat.published.stamp";
const PREV_KEY="hweitat.local.prev";
let PUBINFO={found:false,stamp:null};

/* المدير العام يجهّز ملف النشر */
function publishFile(){
  if(!isAdmin()){toast(T("noAccess"),true); return}
  const o={v:1,pub:stamp(),lang:LANGS[LI].c,cfg:CFG,db:DB};
  dl("data.json",JSON.stringify(o),"application/json");
  try{if(HAS_LS) localStorage.setItem(PUB_KEY,o.pub)}catch(e){}
  PUBINFO={found:true,stamp:o.pub};
  logAct("تعديل","—",T("pub_title")+": "+o.pub);
  saveLocal(); toast(T("pub_done")); go("settings");
}
/* كل جهاز يجلب النسخة المنشورة عند الفتح */
function fetchPublished(){
  if(String(location.protocol).indexOf("http")!==0) return;   /* لا يعمل على الملف المحلي */
  try{
    fetch("data.json",{cache:"no-store"})
      .then(function(r){return r.ok?r.json():null})
      .then(function(j){
        if(!j||!j.pub) return;
        PUBINFO={found:true,stamp:j.pub};
        var seen=null; try{seen=localStorage.getItem(PUB_KEY)}catch(e){}
        if(seen===j.pub) return;                                /* النسخة نفسها — لا شيء */
        try{if(HAS_LS) localStorage.setItem(PREV_KEY,localStorage.getItem(LS_KEY)||"")}catch(e){}
        if(j.cfg) Object.assign(CFG,j.cfg);
        if(j.db){
          Object.keys(j.db).forEach(function(k){if(Array.isArray(j.db[k])) DB[k]=j.db[k]});
          if(j.db.custom&&typeof j.db.custom==="object") DB.custom=Object.assign(CU(),j.db.custom);
        }
        applyCustom();
        try{if(HAS_LS) localStorage.setItem(PUB_KEY,j.pub)}catch(e){}
        saveLocal();
        if(ME){chrome(); buildNav(); go(canView(CUR)?CUR:"home")} else gateRender();
        toast(T("pub_updated"));
      })
      .catch(function(){});
  }catch(e){}
}
/* شبكة أمان: استرجاع ما كان على الجهاز قبل تبنّي النسخة المنشورة */
function restorePrev(){
  var s=null; try{s=localStorage.getItem(PREV_KEY)}catch(e){}
  if(!s){toast(T("pub_noPrev"),true); return}
  try{
    var o=JSON.parse(s);
    if(o.cfg) Object.assign(CFG,o.cfg);
    if(o.db){
      Object.keys(o.db).forEach(function(k){if(Array.isArray(o.db[k])) DB[k]=o.db[k]});
      if(o.db.custom&&typeof o.db.custom==="object") DB.custom=Object.assign(CU(),o.db.custom);
    }
    applyCustom(); saveLocal(); chrome(); buildNav();
    toast(T("pub_prevDone")); go("settings");
  }catch(e){toast(T("bkBad"),true)}
}

const PUBLIC_PAGES=["home","help","region","festival","gallery","map"];   /* متاحة للجميع للاطلاع */
const ADMIN_PAGES=["users","log","settings","terms"];                       /* للمدير العام وحده */
const STAFF_VIEW=["standing","committees"];                         /* اطلاع لأصحاب الحسابات */
let ME=null;
const GUEST={name:["زائر","Invité","Guest"],role:"قارئ",body:DASH,sections:[],
             canAdd:"لا",canEdit:"لا",canDel:"لا",status:"مفعّل",guest:true};

function isAdmin(){return !!ME&&ME.role==="مدير عام"}
function mySections(){return (ME&&Array.isArray(ME.sections))?ME.sections:[]}
function canView(k){
  if(!ME) return false;
  if(isAdmin()) return true;
  if(ADMIN_PAGES.indexOf(k)>=0) return false;
  if(PUBLIC_PAGES.indexOf(k)>=0) return true;
  if(!ME.guest&&STAFF_VIEW.indexOf(k)>=0) return true;
  return mySections().indexOf(k)>=0;
}
function canDo(act,k){
  if(!ME) return false;
  if(isAdmin()) return true;
  if(ME.role==="قارئ") return false;
  if(mySections().indexOf(k)<0) return false;
  if(act==="add")  return ME.canAdd!=="لا";
  if(act==="edit") return ME.canEdit!=="لا";
  if(act==="del")  return ME.canDel==="نعم";
  return false;
}
const initials = s => {const t=String(s||"").replace(/\bال/g,"").trim().split(/\s+/).filter(Boolean);
  return ((t[0]||"?").charAt(0)+((t[1]||"").charAt(0)||"")).toUpperCase()};
/* الحقل الأنسب لتسمية السجل: الاسم أو العنوان قبل غيره */
function labelOf(k,o){
  const S=SCHEMA[k], pref=["name","item","title","org","role"];
  const f=S.fields.filter(x=>pref.indexOf(x.k)>=0)[0]||S.fields[0];
  const v=o[f.k];
  return Array.isArray(v)?(v[0]||v[LI]||""):v;
}

function stamp(){
  const d=new Date(), z=n=>(n<10?"0":"")+n;
  return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())+"  "+z(d.getHours())+":"+z(d.getMinutes());
}
function logAct(act,sec,item){

}

/* ---------- الظهور التدريجي عند التمرير ---------- */
let IO=null;
function initMotion(){
  const els=document.querySelectorAll("#content .hero, #content .card, #content .kpi, #content .gal figure");
  els.forEach((e,i)=>{
    if(!e.classList.contains("reveal")){e.classList.add("reveal");
      e.style.transitionDelay=Math.min(i*32,400)+"ms";}
  });
  if(!MOTION){els.forEach(e=>e.classList.add("in")); return;}
  if(!IO) IO=new IntersectionObserver(en=>en.forEach(x=>{
      if(x.isIntersecting){x.target.classList.add("in"); IO.unobserve(x.target)}
    },{}),{threshold:.08,rootMargin:"0px 0px -40px 0px"});
  els.forEach(e=>{if(!e.classList.contains("in")) IO.observe(e)});
}

let LBSET=[], LBI=0, LBTIMER=null;
function openLB(set,i){
  LBSET=(GALS[set]||[]).map(([k,c])=>[IMG[k],tv(UI[c])]);
  if(!LBSET.length) return;
  LBI=i||0;

    <div class="lbtop">

    </div>

    <img id="lbImg" src="" alt="">

function lbPaint(){
  const [src,cap]=LBSET[LBI];

  if(MOTION){void im.offsetWidth; im.style.animation=""}

  const bar=document.getElementById("lbBar");
  bar.classList.remove("run");
  if(LBTIMER&&MOTION){void bar.offsetWidth; bar.classList.add("run")}
}
function lbStep(d){LBI=(LBI+d+LBSET.length)%LBSET.length; lbPaint()}
function lbAuto(force){
  const on=(force===undefined)? !LBTIMER : force;
  if(LBTIMER){clearInterval(LBTIMER); LBTIMER=null}
  const b=document.getElementById("lbPlay");
  if(on&&MOTION){
    LBTIMER=setInterval(()=>lbStep(1),5000);
    if(b){b.textContent="❚❚"; b.title=T("lb_pause")}
  } else if(b){b.textContent="▶"; b.title=T("lb_play")}

}

}

/* ---------- الرسوم البيانية ---------- */
function barChart(pairs,color){
  color=color||"var(--series-1)";
  const max=Math.max(1,...pairs.map(p=>p[1]));
  return `<div class="chart">`+pairs.map(([l,v])=>`
    <div class="bar-row" title="${esc(l)}: ${num(v)}">
      <span class="bl">${esc(l)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,v/max*100)}%;background:${color}"></div></div>
      <span class="bv">${num(v)}</span>
    </div>`).join("")+`</div>`;
}
const SER=["var(--series-1)","var(--series-2)","var(--series-3)","var(--series-4)"];
function donut(pairs,centerLabel){
  const tot=pairs.reduce((a,p)=>a+p[1],0)||1; let acc=0; const segs=[];
  pairs.forEach((p,i)=>{const from=acc/tot*360; acc+=p[1]; const to=acc/tot*360;
    segs.push(`${SER[i%4]} ${from}deg ${to}deg`);});
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${segs.join(",")})">
      <div class="hole"><b>${num(tot)}</b><s>${esc(centerLabel||T("total"))}</s></div></div>
    <div class="dlist">${pairs.map((p,i)=>`<div><i style="background:${SER[i%4]}"></i>
      <span>${esc(p[0])}</span><b>${num(p[1])} (${Math.round(p[1]/tot*100)}%)</b></div>`).join("")}</div>
  </div>`;
}

}

  if(f.q){const q=f.q.trim().toLowerCase();
    view=view.filter(({r})=>Object.values(r).some(v=>allForms(v).toLowerCase().includes(q)));}
  if(f.v&&S.groupBy) view=view.filter(({r})=>String(r[S.groupBy])===f.v);

  const th=S.fields.map(fl=>`<th>${esc(fLabel(k,fl))}</th>`).join("");
  const body=view.map(({r,i})=>`<tr>`+S.fields.map(fl=>{

      if(fl.k==="status"||fl.k==="avail") return `<td><span class="tag ${statusClass(v)}">${esc(show(v)||"—")}</span></td>`;
      if(fl.t==="sections"){const a=Array.isArray(v)?v:[];

      if(fl.k==="pin"){const s=pinOf(r); return `<td class="num" style="direction:ltr;unicode-bidi:isolate">${s?(isAdmin()?esc(s):"••••"):"—"}</td>`;}
      if(fl.t==="number") return `<td class="num">${v?num(v):"—"}</td>`;

  <tbody>${body||`<tr><td colspan="${S.fields.length+1}" class="empty">${T("noData")}</td></tr>`}</tbody></table></div>`;
}

function closeModal(){document.getElementById("modal").classList.remove("on")}
/* حقول تقنية لا تُترجم — تُخزَّن كنص واحد */
const PLAIN=["pin","phone","ed","link","price","time","date","email"];
const pinOf = u => {const v=u&&u.pin; return String(Array.isArray(v)?(v[0]||""):(v==null?"":v)).trim()};
/* الحفظ: النص الحر يُخزَّن كثلاثية ويُحدَّث في خانة اللغة المعروضة فقط */
function put(orig,val,isEnum){
  if(isEnum) return val;
  const base=Array.isArray(orig)?orig.slice():[orig,orig,orig].map(x=>x==null?"":String(x));
  while(base.length<3) base.push("");
  base[LI]=val;
  /* أي لغة لم يُدخل لها نص بعد تأخذ النص المُدخل حتى لا تظهر خانة فارغة */
  for(let i=0;i<3;i++) if(!String(base[i]||"").trim()) base[i]=val;
  return base;
}
function saveForm(){
  const {k,i}=EDIT, S=SCHEMA[k], fd=new FormData(document.getElementById("frm")), o={};
  const old=(i==null)?{}:DB[k][i];
  S.fields.forEach(fl=>{
    let v=fd.get(fl.k);
    if(fl.t==="number"||fl.t==="meter"){o[fl.k]=Number(v)||0; return;}
    if(fl.t==="sections"){o[fl.k]=fd.getAll(fl.k); return;}
    if(fl.t==="select"){o[fl.k]=v; return;}
    if(fl.t==="date"||fl.t==="time"||fl.t==="email"||PLAIN.indexOf(fl.k)>=0){o[fl.k]=v; return;}
    o[fl.k]=put(old[fl.k],v,false);
  });
  if(old.img!==undefined) o.img=old.img;
  const first=S.fields[0];
  if(!String(fd.get(first.k)||"").trim()){toast(T("reqField")+" "+fLabel(k,first),true); return;}
  const lbl=labelOf(k,o);
  if(i==null){DB[k].push(o); logAct("إضافة",k,lbl); toast(T("added"));}
  else {DB[k][i]=o; logAct("تعديل",k,lbl); toast(T("updated"));}
  closeModal(); saveLocal(); go(k);
}
function del(k,i){
  if(!canDo("del",k)){toast(T("noAccess"),true); return}
  const S=SCHEMA[k];
  document.getElementById("mTitle").textContent=T("confirmDel");
  document.getElementById("mBody").innerHTML=`<p>${T("confirmDelQ")}</p>
    <div class="note">${esc(show(labelOf(k,DB[k][i])))}</div>`;
  document.getElementById("mFoot").innerHTML=`<button class="btn" onclick="closeModal()">${T("cancel")}</button>
    <button class="btn p" style="background:#b23a28;border-color:#b23a28" onclick="doDel('${k}',${i})">${T("del")}</button>`;
  document.getElementById("modal").classList.add("on");
}
function doDel(k,i){
  if(!canDo("del",k)){toast(T("noAccess"),true); return}
  logAct("حذف",k,labelOf(k,DB[k][i]));
  DB[k].splice(i,1); closeModal(); saveLocal(); toast(T("deleted")); go(k);}

/* ---------- تصدير / استيراد ---------- */
function dl(name,content,type){
  const b=new Blob(["﻿"+content],{type:type||"text/plain;charset=utf-8"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
}
function csv(k){
  if(!canView(k)){toast(T("noAccess"),true); return}
  const S=SCHEMA[k];
  const q=s=>'"'+String(s==null?"":s).replace(/"/g,'""')+'"';
  const lines=[S.fields.map(f=>q(fLabel(k,f))).join(",")]
    .concat(DB[k].map(r=>S.fields.map(f=>q(show(r[f.k]))).join(",")));
  dl(secTitle(k)+"-"+LANGS[LI].c+".csv",lines.join("\r\n"),"text/csv;charset=utf-8");
  toast(T("expDone")+" — "+secTitle(k));
}
function backup(){
  dl("hweitat-backup.json",JSON.stringify({lang:LANGS[LI].c,cfg:CFG,db:DB},null,1),"application/json");
  toast(T("bkDone"));
}
function restore(inp){
  const f=inp.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const o=JSON.parse(rd.result);
    if(o.cfg) Object.assign(CFG,o.cfg);
    if(o.db){Object.keys(o.db).forEach(k=>{if(Array.isArray(o.db[k])) DB[k]=o.db[k];});
      if(o.db.custom&&typeof o.db.custom==="object") DB.custom=Object.assign(CU(),o.db.custom);}
    applyCustom();
    const li=LANGS.findIndex(l=>l.c===o.lang);
    saveLocal(); toast(T("bkRestored"));
    setLang(li>=0?li:LI);
  }catch(e){toast(T("bkBad"),true)}};
  rd.readAsText(f);
}
function saveCfg(){
  const fd=new FormData(document.getElementById("cfgFrm"));
  ["name","place","center","region","dept","country","currency","dates","motto"].forEach(k=>{
    CFG[k]=put(CFG[k],fd.get(k),false);});
  ["edition","year"].forEach(k=>CFG[k]=fd.get(k));
  chrome(); paintState(); saveLocal(); toast(T("cfgSaved")); go("settings");
}

const BASE_FIELDS={}; Object.keys(SCHEMA).forEach(function(k){BASE_FIELDS[k]=SCHEMA[k].fields.slice()});
const BASE_NAV=NAV.map(function(g){return [g[0],g[1],g[2].slice()]});
const FTYPES=["text","textarea","number","date","time","email","select","meter"];
function mkField(f){return {k:f.k,l:f.l,t:f.t||"text",o:(f.o&&f.o.length)?f.o:null}}
/* إعادة تركيب المخطط والقائمة من التخصيصات المحفوظة */
function applyCustom(){
  const C=CU();
  if(!C.sections) C.sections=[];
  if(!C.extra) C.extra={};
  Object.keys(SCHEMA).forEach(function(k){if(SCHEMA[k].custom) delete SCHEMA[k]});
  Object.keys(BASE_FIELDS).forEach(function(k){
    SCHEMA[k].fields=BASE_FIELDS[k].concat((C.extra[k]||[]).map(mkField));
  });
  C.sections.forEach(function(s){
    SCHEMA[s.key]={key:s.key,icon:s.icon||"📁",title:s.title,one:s.one,desc:s.desc||null,custom:true,
      fields:(s.fields||[]).map(mkField).concat((C.extra[s.key]||[]).map(mkField))};
    if(!Array.isArray(DB[s.key])) DB[s.key]=[];
  });
  NAV.length=0;
  BASE_NAV.forEach(function(g){NAV.push([g[0],g[1],g[2].slice()])});
  C.sections.forEach(function(s){
    const g=NAV.filter(function(x){return x[0]===(s.group||"nav3")})[0]||NAV[2];
    g[2].push([s.key,s.icon||"📁"]);
  });
}
function isCustomSec(k){return !!(SCHEMA[k]&&SCHEMA[k].custom)}

     <button class="btn p" onclick="saveSection()">${T("save")}</button>`;

function saveSection(){
  const g=function(id){const e=document.getElementById(id); return e?e.value.trim():""};
  const nm=g("sdName");
  if(!nm){toast(T("bd_needName"),true); return}
  const rows=FROWS.filter(function(f){return String(f.l||"").trim()});
  if(!rows.length){toast(T("bd_needField"),true); return}
  const C=CU();
  const old=SEDIT?C.sections.filter(function(x){return x.key===SEDIT})[0]:null;
  const fields=rows.map(function(f,i){
    const prev=old&&old.fields&&old.fields[i];
    return {k:(prev&&prev.k)||("f"+(i+1)),
      l:put(prev?prev.l:null,f.l,false), t:f.t,
      o:f.t==="select"?String(f.o||"").split(/[،,]/).map(function(x){return x.trim()}).filter(Boolean):null};
  });
  if(old){
    old.title=put(old.title,nm,false); old.one=put(old.one,g("sdOne")||nm,false);
    old.icon=g("sdIcon")||"📁"; old.group=g("sdGroup");
    old.desc=g("sdDesc")?put(old.desc,g("sdDesc"),false):null;
    old.fields=fields;
    logAct("تعديل","—",T("bd_edit")+": "+nm);
  }else{
    let n=1; while(C.sections.some(function(x){return x.key==="cs"+n})||SCHEMA["cs"+n]) n++;
    const key="cs"+n;
    C.sections.push({key:key,icon:g("sdIcon")||"📁",group:g("sdGroup"),
      title:put(null,nm,false), one:put(null,g("sdOne")||nm,false),
      desc:g("sdDesc")?put(null,g("sdDesc"),false):null, fields:fields});
    DB[key]=[];
    logAct("إضافة","—",T("bd_new")+": "+nm);
  }
  applyCustom(); closeModal(); saveLocal(); buildNav();
  toast(old?T("bd_updated"):T("bd_created")); go("terms");
}
function delSection(key){
  const C=CU(), s=C.sections.filter(function(x){return x.key===key})[0];
  if(!s) return;
  document.getElementById("mTitle").textContent=T("confirmDel");
  document.getElementById("mBody").innerHTML=`<p>${T("bd_delQ")}</p>
    <div class="note">${s.icon} <b>${esc(tv(s.title))}</b> — ${num((DB[key]||[]).length)} ${T("bd_records")}</div>`;
  document.getElementById("mFoot").innerHTML=`<button class="btn" onclick="closeModal()">${T("cancel")}</button>
    <button class="btn p" style="background:#b23a28;border-color:#b23a28" onclick="doDelSection('${key}')">${T("del")}</button>`;
  document.getElementById("modal").classList.add("on");
}
function doDelSection(key){
  const C=CU();
  const s=C.sections.filter(function(x){return x.key===key})[0];
  C.sections=C.sections.filter(function(x){return x.key!==key});
  delete DB[key]; delete C.extra[key]; delete C.titles[key]; delete C.ones[key];
  DB.users.forEach(function(u){ if(Array.isArray(u.sections))
    u.sections=u.sections.filter(function(x){return x!==key}) });
  logAct("حذف","—",(s?tv(s.title):key));
  applyCustom(); closeModal(); saveLocal(); buildNav();
  toast(T("bd_deleted")); go("terms");
}
